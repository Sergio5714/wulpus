[project]
name = "wulpus"
version = "1.2.3"
description = "Python GUI and host tools for the WULPUS ultrasound platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9,<3.10"
dependencies = [
    "ipympl==0.9.2",
    "ipywidgets==8.0.2",
    "jupyter==1.0.0",
    "matplotlib==3.5.2",
    # 0.2.x uses a Matplotlib API introduced after 3.5.
    "matplotlib-inline==0.1.6",
    "numpy==1.23.5",
    "pyserial==3.5",
    "scipy==1.9.3",
]

[tool.uv]
package = false
